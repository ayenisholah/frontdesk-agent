name: Deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main-branch commit SHA with successful CI and CodeQL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: frontdesk-production-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      DEPLOY_ENABLED: ${{ vars.AWS_DEPLOY_ENABLED }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: eu-west-1
      RUNTIME_STACK: frontdesk-pilot-runtime
      CLOUDFORMATION_ROLE_ARN: ${{ vars.CLOUDFORMATION_RELEASE_ROLE_ARN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify source and deployment configuration before AWS access
        run: |
          node --import tsx infra/bin/preflight.ts
          node --import tsx --input-type=module -e 'import { parseDeploymentConfig } from "./infra/src/release/config.ts"; parseDeploymentConfig(process.env);'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          path: release-source
          persist-credentials: false
      - name: Build exact release images before acquiring AWS credentials
        run: |
          docker build --target runtime --build-arg VCS_REF="$RELEASE_SHA" -t "frontdesk-api:$RELEASE_SHA" release-source
          docker build --target worker-runtime --build-arg VCS_REF="$RELEASE_SHA" -t "frontdesk-worker:$RELEASE_SHA" release-source
          docker build --target migration-runtime --build-arg VCS_REF="$RELEASE_SHA" -t "frontdesk-migrate:$RELEASE_SHA" release-source
      - name: Assume scoped production role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: release-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 7200
      - name: Publish, migrate, promote and verify
        run: node --import tsx infra/bin/deploy.ts
      - name: Preserve sanitized release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release.json
          if-no-files-found: warn
          retention-days: 90
      - name: Remove registry login
        if: always()
        run: docker logout "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
