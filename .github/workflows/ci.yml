name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: frontdesk
          POSTGRES_USER: frontdesk
          POSTGRES_PASSWORD: frontdesk-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U frontdesk -d frontdesk"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
      # Throwaway CI database; the DB integration tests run against it instead of being skipped.
      DATABASE_URL: postgresql://frontdesk:frontdesk-ci-only@127.0.0.1:5432/frontdesk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Module boundaries
        run: npm run check:deps
      - name: Duplicated code
        run: npm run check:dupes
      - name: Unused code
        run: npm run check:unused
      - run: npm run db:deploy
      - name: Tests with 100% coverage gate
        run: npm run test:coverage
      - name: Seed is idempotent
        run: npm run db:seed && npm run db:seed
      - name: Deterministic agent scenarios
        run: npm run eval
      - run: npm run audit:tokens
      - run: npm run audit:units
      - run: npm audit --omit=dev --audit-level=high
      - name: Scan full history for committed secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --no-banner --redact

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image for this exact commit
        run: docker build --build-arg VCS_REF=${{ github.sha }} -t frontdesk-api:${{ github.sha }} .
      - name: Smoke test /healthz
        run: |
          docker run -d --name smoke -p 127.0.0.1:3110:3110 \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:1/db -e REDIS_URL=redis://127.0.0.1:1 \
            -e WHATSAPP_WEBHOOK_ENABLED=true -e WHATSAPP_APP_SECRET=fictional-ci-secret -e WHATSAPP_VERIFY_TOKEN=fictional-ci-token \
            frontdesk-api:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3110/healthz && exit 0; sleep 1; done
          docker logs smoke; exit 1
      - name: Smoke test WhatsApp verification
        run: |
          challenge=$(curl -fsS 'http://127.0.0.1:3110/webhooks/whatsapp?hub.mode=subscribe&hub.verify_token=fictional-ci-token&hub.challenge=12345')
          test "$challenge" = "12345"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3110/webhooks/whatsapp -H 'Content-Type: application/json' -d '{}')
          test "$status" = "401"
      - name: Check revision label
        run: |
          label=$(docker image inspect frontdesk-api:${{ github.sha }} --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test "$label" = "${{ github.sha }}"
