name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: frontdesk
          POSTGRES_USER: frontdesk
          POSTGRES_PASSWORD: frontdesk-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U frontdesk -d frontdesk"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Throwaway CI database; the DB integration tests run against it instead of being skipped.
      DATABASE_URL: postgresql://frontdesk:frontdesk-ci-only@127.0.0.1:5432/frontdesk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Module boundaries
        run: npm run check:deps
      - name: Duplicated code
        run: npm run check:dupes
      - run: npm run db:deploy
      - name: Tests with 100% coverage gate
        run: npm run test:coverage
      - name: Seed is idempotent
        run: npm run db:seed && npm run db:seed
      - run: npm run audit:tokens
      - run: npm run audit:units
