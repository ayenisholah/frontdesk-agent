# Production stack on the VPS. Secrets come from ~/frontdesk/.env (mode 600), generated on the server.
# Only the API is published, and only on loopback; nginx terminates TLS in front of it.
name: frontdesk

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: frontdesk
      POSTGRES_USER: frontdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontdesk -d frontdesk"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *hardening
    image: redis:7-alpine
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 96mb --maxmemory-policy noeviction']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes: [redisdata:/data]
    networks: [backend]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *hardening
    image: frontdesk-api:${RELEASE_SHA:?RELEASE_SHA is required}
    environment:
      RELEASE_SHA: ${RELEASE_SHA}
      LOG_LEVEL: info
      DATABASE_URL: postgresql://frontdesk:${POSTGRES_PASSWORD}@postgres:5432/frontdesk
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports: ["127.0.0.1:3110:3110"]
    networks: [backend, edge]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

networks:
  backend:
    internal: true
  edge: {}

volumes:
  pgdata:
  redisdata:
